name: Compiler et tester SC4R iPhone
on:
  workflow_dispatch:
  push:
    branches: ["codex/sc4r-ios-native"]
    paths:
      - "SC4R-iOS-sources.zip"
      - ".github/workflows/sc4r-ios.yml"
permissions:
  contents: read
concurrency:
  group: sc4r-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extraire le projet SwiftUI complet
        run: unzip -q SC4R-iOS-sources.zip -d .source
      - name: Tests iPhone puis archive native
        working-directory: .source/ios
        env:
          SC4R_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-ios.sh all
      - name: IPA non signée pour signature personnelle
        uses: actions/upload-artifact@v4
        with:
          name: SC4R-iPhone-non-signe
          path: |
            .source/ios/build/SC4R-unsigned.ipa
            .source/ios/build/LIRE_AVANT_INSTALLATION.txt
          if-no-files-found: error
          retention-days: 7
      - name: Résultats des tests et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SC4R-tests-natifs
          path: |
            .source/ios/build/Tests.xcresult
            .source/ios/build/*.log
          if-no-files-found: warn
          retention-days: 7
